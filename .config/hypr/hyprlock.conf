# Sourcing Pywal colors for dynamic highlights
source = $HOME/.cache/wal/colors-hyprland.conf

# Background setup with heavy frosted-glass blur
background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 9
    noise = 0.015
    contrast = 0.9
    brightness = 0.75
    vibrancy = 0.2
}

general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
    hide_cursor = true
}

# --- FUTURISTIC CLOCK ---
# Large Hour / Minute block
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(245, 245, 245, 0.95)
    font_size = 130
    font_family = NDOT 47, Orbitron, Tomorrow, SF Pro Display
    position = 0, 100
    halign = center
    valign = center

    # Cyberpunk / Nothing Glow effect
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(255, 255, 255, 0.18)
}

# --- VIBRATING / RED ERROR INPUT FIELD ---
input-field {
    monitor =
    size = 280, 56
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true

    # Normal State: Frosted glass squircle
    outer_color = rgba(255, 255, 255, 0.12)
    inner_color = rgba(10, 10, 15, 0.6)
    font_color = rgb(240, 240, 240)
    rounding = 24
    fade_on_empty = false
    placeholder_text = <span font_family="NDOT 47" foreground="##666666">AUTH REQUIRED</span>

    # Shake on wrong password / pin
    fail_transition = 200
    fail_color = rgb(255, 59, 48) # Vivid red
    fail_text = <span font_family="NDOT 47" foreground="##ff3b30">ACCESS DENIED <b>($ATTEMPTS)</b></span>

    # Vibration parameters
    shake = true
    shake_attempts = 3
    shake_size = 14
    shake_speed = 5.0
    shake_translation = true
    shake_rotational = false

    # Checking / Active state
    check_color = rgba(255, 255, 255, 0.8)

    position = 0, -120
    halign = center
    valign = center
}